<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a Quote — Mondo Medical</title>
<meta name="description" content="Submit your contact information to request a quote for the equipment you've selected.">
<link rel="alternate" hreflang="en" href="https://www.mondo-medical.example/en/quote/request/">
<link rel="alternate" hreflang="fr" href="https://www.mondo-medical.example/fr/devis/demande/">
<link rel="canonical" href="https://www.mondo-medical.example/en/quote/request/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header-slot"></div>
<main id="main">
  <div class="page-header">
    <div class="container">
      <div class="eyebrow">Quote Request</div>
      <h1 class="h-xl" id="wizard-top">Request a Quote</h1>
      <p class="lede">Tell us how to reach you — our sales team will follow up with pricing and availability.</p>
    </div>
  </div>

  <section>
    <div class="container" style="max-width:880px">
      <div id="wizard-empty" class="empty-state" style="display:none"></div>

      <div id="quote-wizard">
        <div class="steps-row">
          <div class="step-pill active" data-step-pill="1"><span class="num">1</span><span>Your Information</span></div>
          <div class="step-sep"></div>
          <div class="step-pill" data-step-pill="2"><span class="num">2</span><span>Review &amp; Submit</span></div>
        </div>

        <div class="quote-summary-box" style="margin-bottom:36px">
          <h3 class="h-sm" style="margin-bottom:6px">Your Selected Equipment</h3>
          <div id="wizard-cart-summary"></div>
        </div>

        <form id="quote-request-form" novalidate>
          <div data-step-panel="1" class="active">
            <div class="form-grid">
              <div class="field full">
                <label>Customer Type<span class="req">*</span></label>
                <div class="radio-row">
                  <label class="radio-opt"><input type="radio" name="customerType" value="Company" data-type="company" checked> Company / Organization</label>
                  <label class="radio-opt"><input type="radio" name="customerType" value="Individual" data-type="individual"> Individual</label>
                </div>
              </div>
              <div class="field"><label>First Name<span class="req">*</span></label><input type="text" name="firstName" data-required><span class="error-msg"></span></div>
              <div class="field"><label>Last Name<span class="req">*</span></label><input type="text" name="lastName" data-required><span class="error-msg"></span></div>
              <div class="field" id="company-field"><label>Company / Organization<span class="req" id="company-req">*</span></label><input type="text" name="company" data-required><span class="error-msg"></span></div>
              <div class="field"><label>Email<span class="req">*</span></label><input type="email" name="email" data-required><span class="error-msg"></span></div>
              <div class="field"><label>Phone<span class="req">*</span></label><input type="tel" name="phone" data-required><span class="error-msg"></span></div>
              <div class="field"><label>Country<span class="req">*</span></label><input type="text" name="country" data-required><span class="error-msg"></span></div>
              <div class="field"><label>City<span class="req">*</span></label><input type="text" name="city" data-required><span class="error-msg"></span></div>
              <div class="field"><label>Address</label><input type="text" name="address"></div>
              <div class="field full">
                <label>Preferred Contact Method</label>
                <div class="radio-row">
                  <label class="radio-opt"><input type="radio" name="contactMethod" value="Email" checked> Email</label>
                  <label class="radio-opt"><input type="radio" name="contactMethod" value="Phone"> Phone</label>
                  <label class="radio-opt"><input type="radio" name="contactMethod" value="WhatsApp"> WhatsApp</label>
                </div>
              </div>
              <div class="field full"><label>Additional Message</label><textarea name="message" placeholder="Tell us more about your requirements, timeline, or facility."></textarea></div>
            </div>
            <button type="button" id="to-step-2" class="btn btn-primary">Continue to Review</button>
          </div>

          <div data-step-panel="2">
            <h3 class="h-sm">Your Request</h3>
            <div id="review-products" style="margin:16px 0 28px;display:flex;flex-direction:column;gap:8px"></div>

            <h3 class="h-sm">Customer Information</h3>
            <div class="quote-summary-box" style="margin-top:14px">
              <div class="row"><span>Customer Type</span><strong id="review-customer-type"></strong></div>
              <div class="row"><span>Name</span><strong id="review-name"></strong></div>
              <div class="row" id="review-company-row"><span>Company</span><strong id="review-company"></strong></div>
              <div class="row"><span>Email</span><strong id="review-email"></strong></div>
              <div class="row"><span>Phone</span><strong id="review-phone"></strong></div>
              <div class="row"><span>Location</span><strong id="review-location"></strong></div>
            </div>
            <h3 class="h-sm" style="margin-top:26px">Message</h3>
            <p class="body-text" id="review-message" style="margin-top:8px"></p>

            <div class="field" style="margin-top:30px">
              <div class="checkbox-row">
                <input type="checkbox" id="consent-checkbox">
                <label for="consent-checkbox">I agree to be contacted regarding my quote request.</label>
              </div>
              <span class="error-msg"></span>
            </div>

            <div style="display:flex;gap:12px;margin-top:20px;flex-wrap:wrap">
              <button type="button" id="back-to-step-1" class="btn btn-ghost">Back</button>
              <button type="submit" id="submit-request-btn" class="btn btn-primary">Submit Quote Request</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>
<div id="site-footer-slot"></div>

<script>
  window.PAGE_LANG = "en";
  window.PAGE_KEY = "quote";
  window.ALT_LANG_URL = "/fr/devis/demande/";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/icons.js"></script>
<script src="/assets/js/render-helpers.js"></script>
<script src="/assets/js/quote.js"></script>
<script src="/assets/js/popularity.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/quote-submit.js"></script>
<script src="/assets/js/partials.js"></script>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/quote-request.js"></script>
</body>
</html>
