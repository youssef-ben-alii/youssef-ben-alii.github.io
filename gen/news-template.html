<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — Mondo Medical</title>
<meta name="description" content="{{DESC}}">
<link rel="alternate" hreflang="en" href="https://www.mondo-medical.example{{EN_URL}}">
<link rel="alternate" hreflang="fr" href="https://www.mondo-medical.example{{FR_URL}}">
<link rel="canonical" href="https://www.mondo-medical.example{{CANONICAL}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<a class="skip-link" href="#main">{{SKIP}}</a>
<div id="site-header-slot"></div>
<main id="main">
  <div class="page-header">
    <div class="container article-hero">
      <nav class="breadcrumb" id="article-breadcrumb" aria-label="Breadcrumb" style="justify-content:center"></nav>
      <h1 class="h-xl" id="article-title"></h1>
      <div class="article-meta"><span id="article-date"></span></div>
    </div>
  </div>

  <section>
    <div class="container">
      <div class="article-body" id="article-body"></div>
    </div>
  </section>

  <section class="bg-off" id="article-related-section">
    <div class="container">
      <div class="section-head"><h2 class="h-lg" id="article-related-title"></h2></div>
      <div class="grid grid-3" id="article-related-grid"></div>
    </div>
  </section>
  <div id="article-root"></div>
</main>
<div id="site-footer-slot"></div>

<script>
  window.PAGE_LANG = "{{LANG}}";
  window.PAGE_KEY = "news";
  window.ALT_LANG_URL = "{{ALT_URL}}";
  window.ARTICLE_ID = "{{ARTICLE_ID}}";
</script>
<script src="/assets/js/data-brands.js"></script>
<script src="/assets/js/data-products.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/icons.js"></script>
<script src="/assets/js/render-helpers.js"></script>
<script src="/assets/js/quote.js"></script>
<script src="/assets/js/popularity.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/quote-submit.js"></script>
<script src="/assets/js/partials.js"></script>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/news-article.js"></script>
</body>
</html>
