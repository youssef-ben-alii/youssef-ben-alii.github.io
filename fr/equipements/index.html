<body>
<a class="skip-link" href="#main">Aller au contenu</a>
<div id="site-header-slot"></div>
<main id="main">
  <div class="page-header">
    <div class="container">
      <div class="eyebrow">Catalogue</div>
      <h1 class="h-xl">Équipements médicaux</h1>
      <p class="lede">Découvrez notre gamme d'équipements médicaux professionnels.</p>
    </div>
  </div>

  <section class="section-tight">
    <div class="container">
      <div class="filters-bar">
        <div class="search-input-wrap">
          <input type="search" id="catalog-search" class="search-input" placeholder="Rechercher un équipement...">
        </div>
        <select id="filter-category" class="select-field"><option value="">Toutes les catégories</option></select>
        <select id="filter-brand" class="select-field"><option value="">Toutes les marques</option></select>
        <select id="sort-select" class="select-field">
          <option value="featured">En vedette</option>
          <option value="newest">Plus récents</option>
          <option value="az">A–Z</option>
          <option value="brand">Marque</option>
        </select>
        <span class="count" id="result-count"></span>
      </div>

      <div class="grid grid-3" id="product-grid"></div>
      <div class="empty-state" id="empty-results" style="display:none">
        <div class="icon" id="empty-icon"></div>
        <h2 class="h-md empty-title"></h2>
        <p class="body-text empty-sub" style="margin:14px auto 0"></p>
      </div>
    </div>
  </section>
</main>
